# Nginx reverse proxy for River Gateway (alternative to Caddy).
# Install as /etc/nginx/conf.d/river-gateway.conf, replace gateway.example.com
# with your domain, then `nginx -t && systemctl reload nginx`, and add HTTPS with
# `certbot --nginx -d <your domain>`. See DEPLOY.md, step 8B.

server {
    listen 80;
    server_name gateway.example.com;

    # River accepts up to 50 MiB of JSON (base64 images included); nginx allows 1 MiB by default.
    client_max_body_size 50m;

    # Prometheus metrics are unauthenticated: keep them off the internet.
    location = /metrics { return 404; }

    # Optional, recommended: only your own IP may open the console, admin API and docs.
    # location ~ ^/(ui|admin|docs|redoc|openapi\.json) {
    #     allow 203.0.113.7;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed (SSE) answers must not be buffered.
        proxy_buffering off;
        # River: prefill up to 10 minutes, non-streaming answers up to 15.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
