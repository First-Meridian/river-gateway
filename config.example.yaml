# River Gateway 配置示例：复制为 config.yaml 后按需修改。
# 字符串里可以写 ${ENV_VAR} 或 ${ENV_VAR:-默认值}；本文件同目录下的 .env 会被自动加载。

server:
  host: 127.0.0.1            # 需要对局域网/公网提供服务时改成 0.0.0.0
  port: 8080
  max_body_bytes: 52428800   # River 上限：请求体 50 MiB（含 base64 图片与对话历史）
  cors_origins: []           # 浏览器直接调用网关时，填允许的来源，如 ["http://localhost:3000"]
  metrics: true              # 暴露 /metrics（Prometheus 格式），不要直接暴露到公网
  ui: true                   # 管理控制台 /ui（用 admin_token 登录）；false 则关闭
  log_level: info

database: data/gateway.db    # SQLite：网关密钥（哈希）与用量日志；相对路径基于本文件所在目录

# 管理 API（/admin/*）令牌。留空则关闭管理 API，此时用命令行管理密钥。
admin_token: ${GATEWAY_ADMIN_TOKEN}

upstreams:
  river:                                # River Cloud 公共推理接口
    base_url: https://api.river.ai/v1
    api_key: ${RIVER_API_KEY}           # River key 只保存在网关服务器上
    connect_timeout: 10
    read_timeout: 900                   # River：prefill 最长 10 分钟，非流式响应最长 15 分钟
    # max_concurrency: 32               # 发往该上游的最大并发，超出的请求排队
    # queue_timeout: 30                 # 排队超过该秒数返回 503（有回退模型时改走回退）
    inject_stream_usage: true           # 流式对话自动请求 usage，用于计费；River 不支持时会自动关闭

  # 专属部署（训练后的模型）：base_url 直接填 create_deployment() 返回的 deployment.base_url（已含 /v1）
  # my-deployment:
  #   base_url: https://<deployment.base_url>
  #   api_key: ${RIVER_TEAM_API_KEY}    # 具备部署访问权限的团队 key

default_upstream: river        # 未在 models 中配置的模型名原样转发到这里；留空则只允许 models 里的模型
expose_upstream_models: true   # /v1/models 是否合并 River 返回的模型列表
models_cache_seconds: 300

# 模型路由：别名、默认参数、回退
models:
  - name: fast
    target: deepseek-ai/DeepSeek-V4.1-Flash
    chat_defaults: {reasoning_effort: none}          # 仅在客户端没传该字段时生效
    responses_defaults: {reasoning: {effort: none}}
    fallbacks: [zai-org/GLM-5.3-Flash]               # 429/5xx/连不上且重试用尽后，改用这些模型

  - name: smart
    target: moonshotai/Kimi-K3
    fallbacks: [deepseek-ai/DeepSeek-V4.1-Flash]

  # - name: my-agent                  # 通过专属部署提供的训练后模型
  #   upstream: my-deployment
  #   target: <deployment.model>      # 即 deployment.id
  #   price: {input: 0, output: 0}    # 专属部署按 GPU 小时计费，不按 token 估算

retry:
  max_retries: 2             # 仅在 429/500/502/503/504 或请求未送达（连接失败）时重试
  backoff_base: 0.5
  backoff_max: 8
  max_retry_after: 30        # River 的 Retry-After 超过该秒数时不等待，直接回退或把 429/503 返回给客户端

pricing:
  url: https://console.river.ai/api/public/pricing   # River 公开价格（美元 / 百万 token）
  refresh_seconds: 3600
  overrides: {}
  #   some/model: {input: 0.1, cached_input: 0.01, output: 0.4}

validation:
  image_mime_types: [image/jpeg, image/png]   # River 只接受 JPEG 和 PNG
  reject_unsupported_responses_params: true   # 拦截 store:true / background / previous_response_id / conversation
  responses_store_default_false: true         # Responses 请求没写 store 时补上 store:false

accounts:
  # River 账号池作用于哪个上游（默认 default_upstream）。账号在控制台“River 账号”页
  # 或 `river-gateway accounts` 命令里管理；.env 的 RIVER_API_KEY 是第一个账号。
  upstream: null

key_defaults:                # 新建网关密钥的默认限额（创建时传 0 表示不限）
  rpm: 60
  max_concurrency: 8
